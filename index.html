<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>

    <link rel="stylesheet" href="../style/app.css">
    <link rel="stylesheet" href="../style/header.css">
    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/taskAddModal.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

</head>
<body>
    <div id="app">
        <div id="root">
            <div class="contenedor">

                <header class="header">
                    <h1>Todo App</h1>
                    <section class="filterTaskContent">
                        <label for="searchTaskInput">
                            <h2>Buscar</h2>
                        </label>
                        <div class="tasksFilterInput">
                            <span class="material-symbols-outlined">search</span>
                            <input type="text" name="searchTaskInput" id="searchTaskInput" placeholder="Ingresa el titulo de la tarea">
                        </div>
                    </section>
                </header>

                <main class="contentAll">
                    <section class="contentMainFirst">
                        <div class="openAddTask">
                            <button class="btn-openAddTask">
                                <h2>AGREGAR TAREA</h2>
                                <span class="material-symbols-outlined">list_alt_add</span>
                            </button>
                        </div>

                        <div class="taskListContent">
                            <ul id="taskListItem">
                            </ul>
                        </div>

                        <section class="navContent navRoot1">
                            <div class="navMenuButtons">
                                <button class="btn-historyNav1 activeNav">
                                    <span class="material-symbols-outlined">arrow_circle_left</span>
                                    HISTORIAL
                                </button>
                                <button class="btn-backNav1">
                                    <span class="material-symbols-outlined">arrow_circle_right</span>
                                    VOLVER
                                </button>
                            </div>
                            <div class="historial">
                                <div class="interiorHistorial">
                                    <h2>Historial tareas</h2>
                                    <ul class="historyList">
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <section class="navContent navRoot2">
                            <div class="navMenuButtons">
                                <button class="btn-deleteNav2 activeNav">
                                    ELIMINAR
                                    <span class="material-symbols-outlined">arrow_circle_right</span>
                                </button>
                                <button class="btn-backNav2">
                                    VOLVER
                                    <span class="material-symbols-outlined">arrow_circle_left</span>
                                </button>
                            </div>
                            
                            <div class="papelera">
                                <div class="interiorPapelera">
                                    <h2>ELIMINAR TAREA</h2>
                                    <p>(arrastra la tarea aqui para eliminarla)<p>
                                    <span class="material-symbols-outlined">close</span>
                                </div>
                            </div>
                        </section>
                    </section>
                </main>
                
                <footer id="footer">
                    <div class="ownerData">
                        <span>Creado y diseñado por @Alsix-dev - 2026</span>
                    </div>
                </footer>

                <div id="overlays" class="">
                    <!--############################ MENU DE AGREGAR TAREA -->
                    <section class="=" id="createTaskModal">
                        <div class="createTaskMenuTitle">
                            <h2>NUEVA TAREA</h2>
                            <button class="btn-cancelMenu">
                                <span class="material-symbols-outlined iconoCancelarMenu">close</span>
                            </button>
                        </div>

                        <form id="creatTaskForm" novalidate>
                            <div class="taskTitleInputContent">
                                <label for="enterTitleTaskCreate">
                                    <h3>Titulo tarea</h3>
                                </label>
                                <div class="taskTitleInput">
                                    <span class="material-symbols-outlined iconoAddTask">format_h3</span>
                                    <input type="text"
                                        name="enterTitleTaskCreate" id="enterTitleTaskCreate" 
                                        placeholder="Ingresa el titulo de la tarea"
                                        autocomplete="off">
                                </div>
                            </div>

                            <div class="taskDetailsContent">
                                <label for="enterDetailsTaskCreate">
                                    <h3>Descripción</h3>
                                </label>
                                <div class="textareaAddTask">
                                    <span class="material-symbols-outlined iconoDetailsTask">text_ad</span>
                                    <textarea
                                        name="enterDetailsTaskCreate" id="enterDetailsTaskCreate"
                                        placeholder="Descripción de la tarea"></textarea>
                                </div>
                            </div>

                            <div class="taskExtrasContent">
                                <div class="taskExtras-Date">
                                    <label for="enterTaskDateCreate">
                                        <h3>Fecha límite</h3>
                                    </label>
                                    <input type="date" 
                                        name="enterTaskDateCreate" id="enterTaskDateCreate">
                                </div>

                                <div class="taskExtras-Collaborator">
                                    <label for="enterTaskCbCreate">
                                        <h3>Colaborador</h3>
                                    </label>
                                    <div class="addTaskCb">
                                        <span class="material-symbols-outlined iconoColaborador">co_present</span>
                                        <input type="text" 
                                            name="enterTaskCbCreate" id="enterTaskCbCreate" placeholder="Colaborador"
                                            autocomplete="off">  
                                    </div>
                                </div>
                            </div>

                            <button type="submit" id="btn-addTask">
                                CREAR TAREA
                            </button>
                            <div class="exit-menuModal">
                                <button type="button" class="btn-cancelMenu">
                                    CANCELAR
                                </button>
                            </div>
                        </form>

                        <div class="reportError">
                            <ul id="MessageError">
                                <!-- <li>El titulo es obligatorio debe llenar el campo para poder cumplir</li> -->
                            </ul>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../script/crearTarea.js"></script>
    <script type="module" src="../script/operarTarea.js"></script>
    <script type="module" src="../script/modals.js"></script>
    <script type="module" src="../script/genericas.js"></script>
    <script type="module" src="../script/formulario.js"></script>
    <script type="module" src="../script/buscarTarea.js"></script>
    <script type="module" src="../script/papelera.js"></script>
    <script type="module" src="../script/historial.js"></script>
</body>
</html>
